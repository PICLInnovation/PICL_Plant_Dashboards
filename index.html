<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PICL India · Plant Dashboards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#12284a; --amber:#f5b301; --live:#22b36b;
    --bg:#eef2f8; --surface:#ffffff; --line:#dde4ef; --text:#14213a; --mute:#5b6a82;
    --head:#ffffff; --head-line:#e3e9f2; --hover:#f1f5fb; --shadow:0 1px 2px rgba(18,40,74,.05),0 8px 24px rgba(18,40,74,.06);
    --head-h:64px; --nav-h:64px;
    --font-d:"Barlow Semi Condensed","Segoe UI",system-ui,sans-serif;
    --font-b:"Barlow","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  }
  :root[data-theme="dark"]{
    --navy:#dfe8f7; --bg:#0a111d; --surface:#111b2c; --line:#23314a; --text:#e8eef8; --mute:#90a0ba;
    --head:#0f1a2a; --head-line:#1f2d45; --hover:#16233a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font-b); background:var(--bg); color:var(--text); display:flex; flex-direction:column; overflow:hidden}
  button,a{font-family:inherit}
  :focus-visible{outline:2px solid var(--amber); outline-offset:2px}

  /* ================= Header ================= */
  .head{
    flex:0 0 var(--head-h); height:var(--head-h); display:flex; align-items:stretch; gap:34px; padding:0 22px;
    background:var(--head); border-bottom:1px solid var(--head-line); box-shadow:0 2px 12px rgba(18,40,74,.05);
    position:relative; z-index:10;
  }
  .brand{display:flex; align-items:center; gap:12px; flex:0 0 auto; cursor:pointer; background:none; border:0; color:inherit; text-align:left}
  .mark{
    width:40px; height:40px; border-radius:10px; background:#12284a; color:var(--amber);
    display:grid; place-items:center; font-family:var(--font-d); font-weight:700; font-size:15px; letter-spacing:.02em;
  }
  :root[data-theme="dark"] .mark{background:var(--amber); color:#0f1a2a}
  .brand h1{font-family:var(--font-d); font-size:19px; font-weight:700; line-height:1.05; color:var(--navy)}
  .brand p{font-size:12px; color:var(--mute); margin-top:2px}

  .tabs{display:flex; align-items:stretch; flex:1 1 auto; min-width:0; gap:4px; overflow-x:auto; scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    appearance:none; background:transparent; border:0; color:var(--mute); cursor:pointer; position:relative; white-space:nowrap;
    display:flex; align-items:center; gap:9px; padding:0 16px; font-size:15px; font-weight:500;
    transition:color .15s, background .15s;
  }
  .tab:hover{color:var(--text); background:var(--hover)}
  .tab svg.ic{width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto}
  .tab::after{content:""; position:absolute; left:10px; right:10px; bottom:-1px; height:3px; border-radius:3px 3px 0 0; background:var(--amber); transform:scaleX(0); transition:transform .2s}
  .tab[aria-selected="true"]{color:var(--navy); font-weight:600}
  .tab[aria-selected="true"]::after{transform:scaleX(1)}
  .lamp{width:7px; height:7px; border-radius:50%; flex:0 0 auto; box-shadow:inset 0 0 0 1.5px var(--line)}
  .tab[data-state="loading"] .lamp{background:var(--amber); box-shadow:none; animation:blink 1s ease-in-out infinite}
  .tab[data-state="live"] .lamp{background:var(--live); box-shadow:none}
  @keyframes blink{50%{opacity:.25}}

  .right{display:flex; align-items:center; gap:4px; flex:0 0 auto}
  .btn{
    appearance:none; width:38px; height:38px; border-radius:10px; border:0; background:transparent; color:var(--mute);
    cursor:pointer; display:grid; place-items:center; text-decoration:none; transition:background .15s,color .15s;
  }
  .btn:hover{background:var(--hover); color:var(--text)}
  .btn svg{width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}

  /* ================= Stage ================= */
  .stage{flex:1 1 auto; min-height:0; position:relative}
  .pane{position:absolute; inset:0; display:none}
  .pane.active{display:block}
  iframe{width:100%; height:100%; border:0; display:block; background:#fff}

  .loader{position:absolute; inset:0; z-index:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background:var(--bg); color:var(--mute); font-size:14px; transition:opacity .25s}
  .loader.hide{opacity:0; pointer-events:none}
  .ring{width:34px; height:34px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--amber); animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loader .hint{display:none}
  .loader.slow .hint{display:block}
  .loader a{color:var(--navy); font-weight:600}

  /* ================= Home ================= */
  .home{overflow-y:auto}
  .wrap{max-width:1120px; margin:0 auto; padding:44px 28px 56px}
  .home h2{font-family:var(--font-d); font-size:38px; font-weight:700; color:var(--navy); line-height:1.05}
  .home .lead{margin-top:10px; font-size:16.5px; color:var(--mute); max-width:60ch; line-height:1.5}
  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:20px; margin-top:30px}
  .card{
    --c:#2563eb; --cs:#e6efff;
    position:relative; text-align:left; cursor:pointer; color:inherit; font:inherit;
    background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:26px 26px 22px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:14px; overflow:hidden; transition:transform .18s, border-color .18s;
  }
  .card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--c)}
  .card:hover{transform:translateY(-3px); border-color:var(--c)}
  .card .top{display:flex; align-items:center; gap:14px}
  .tile{width:52px; height:52px; border-radius:14px; background:var(--cs); color:var(--c); display:grid; place-items:center; flex:0 0 auto}
  :root[data-theme="dark"] .card{--cs:rgba(255,255,255,.07)}
  .tile svg{width:26px; height:26px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
  .card h3{font-family:var(--font-d); font-size:25px; font-weight:700; color:var(--text); line-height:1.1}
  .card .desc{font-size:15.5px; color:var(--mute); line-height:1.5}
  .chips{display:flex; flex-wrap:wrap; gap:7px}
  .chip{font-size:12.5px; font-weight:500; padding:4px 10px; border-radius:999px; background:var(--bg); color:var(--mute); border:1px solid var(--line)}
  .open{margin-top:4px; align-self:flex-start; font-weight:600; font-size:14.5px; color:#fff; background:var(--c); padding:10px 18px; border-radius:10px}
  .foot{margin-top:28px; font-size:13.5px; color:var(--mute)}

  /* ================= Full screen ================= */
  body.kiosk .head,body.kiosk .tabs{display:none}
  .exit{display:none; position:fixed; top:10px; right:12px; z-index:30; width:38px; height:38px; border-radius:50%; border:0;
    background:#12284a; color:#fff; cursor:pointer; place-items:center; opacity:.5; transition:opacity .15s}
  .exit:hover,.exit:focus-visible{opacity:1}
  .exit svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round}
  body.kiosk .exit{display:grid}

  /* ================= Responsive ================= */
  @media (max-width:1100px){ .head{gap:18px; padding:0 14px} .tab{padding:0 12px; font-size:14.5px; gap:7px} .brand p{display:none} }
  @media (max-width:900px){ .brand > div:last-child{display:none} .btn.opt{display:none} .grid{gap:16px} }

  @media (max-width:760px){
    :root{--head-h:56px}
    .head{justify-content:space-between; padding:0 12px; gap:10px}
    .brand > div:last-child{display:block}
    .mark{width:36px; height:36px; font-size:12.5px}
    .brand h1{font-size:18px}
    .tabs{
      position:fixed; left:0; right:0; bottom:0; z-index:20; gap:0; overflow:visible;
      height:calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom:env(safe-area-inset-bottom);
      background:var(--head); border-top:1px solid var(--head-line); box-shadow:0 -4px 16px rgba(18,40,74,.08);
    }
    .tab{flex:1 1 0; min-width:0; flex-direction:column; justify-content:center; gap:3px; padding:0 1px; font-size:11px}
    .tab svg.ic{width:22px; height:22px}
    .tab::after{left:24%; right:24%; top:0; bottom:auto; border-radius:0 0 3px 3px}
    .lamp{position:absolute; top:9px; right:calc(50% - 20px); width:6px; height:6px}
    .stage{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
    body.kiosk .stage{padding-bottom:0}
    .wrap{padding:26px 16px 36px}
    .home h2{font-size:29px}
    .home .lead{font-size:15px}
    .grid{grid-template-columns:1fr; margin-top:22px}
    .card{padding:20px 18px 18px}
    .card h3{font-size:22px}
  }
  @media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }
</style>
</head>
<body>

<header class="head">
  <button class="brand" id="brand" aria-label="Go to home">
    <div class="mark" aria-hidden="true">PICL</div>
    <div><h1>PICL India</h1><p>Plant dashboards</p></div>
  </button>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Dashboards"></nav>

  <div class="right">
    <button class="btn" id="btnReload" title="Reload this dashboard" aria-label="Reload this dashboard">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
    <a class="btn opt" id="btnOpen" target="_blank" rel="noopener" title="Open in a new tab" aria-label="Open in a new tab">
      <svg viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg></a>
    <button class="btn opt" id="btnKiosk" title="Full screen" aria-label="Full screen">
      <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
    <button class="btn" id="btnTheme" title="Switch light / dark" aria-label="Switch light or dark">
      <svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg></button>
  </div>
</header>

<button class="exit" id="btnExit" title="Show header (Esc)" aria-label="Exit full screen">
  <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>

<main class="stage" id="stage"></main>

<script>
/* ===================================================================
   EDIT HERE: add, rename or reorder dashboards. Nothing else to change.
   icon = users | bolt | wrench | factory     color = card accent
   =================================================================== */
const DASHBOARDS = [
  { id:"manpower", label:"Manpower", icon:"users", color:"#2563eb", soft:"#e6efff",
    url:"https://piclinnovation.github.io/Manpower_Dashboard/",
    desc:"Approved strength against people present, section by section, with on-time and early arrival.",
    chips:["Attendance","Shortfall / surplus","Punctuality","Day / night shift"] },
  { id:"utility", label:"Utility", icon:"bolt", color:"#d68a00", soft:"#fff2d6",
    url:"https://piclinnovation.github.io/PICL-India-Maintenance_Utility_Dashboard/",
    desc:"Electricity, gas and water use across lines and areas, day by day or month by month.",
    chips:["Electricity","HVAC","Compressor","Lighting","Solar / DG","PNG gas","Diesel","Water"] },
  { id:"maintenance", label:"Maintenance", icon:"wrench", color:"#0f9d8a", soft:"#dcf5f0",
    url:"https://piclinnovation.github.io/PICL_Maintanance_Dashboard/",
    desc:"Total productive maintenance on the shop floor, filtered by shift and line.",
    chips:["TPM","Shift-wise","Line-wise","Daily / weekly / monthly"] },
  { id:"manufacturing", label:"Manufacturing", icon:"factory", color:"#5b4ee0", soft:"#e9e6ff",
    url:"https://piclinnovation.github.io/PICL_COMBINE_Manufacturing_Dashboard-/",
    desc:"Safety, quality, delivery and cost for the daily line review and for leadership trends.",
    chips:["Safety","Quality","Delivery","Cost","Shop floor view","Leadership view"] }
];
/* =================================================================== */

const ICONS = {
  home:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  bolt:'<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>',
  wrench:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94z"/>',
  factory:'<path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2z"/><path d="M17 18h1"/><path d="M12 18h1"/><path d="M7 18h1"/>'
};
const svg = k => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]||""}</svg>`;

const $ = s => document.querySelector(s);
const tabsEl = $("#tabs"), stage = $("#stage");
const panes = {}; let current = null;
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
};

/* ---------- tab factory ---------- */
function addTab(id, label, icon, withLamp){
  const b = document.createElement("button");
  b.className = "tab"; b.id = "tab-" + id; b.setAttribute("role","tab"); b.setAttribute("aria-selected","false");
  b.dataset.state = "idle"; b.title = label;
  b.innerHTML = `${svg(icon)}<span>${label}</span>${withLamp ? '<span class="lamp" aria-hidden="true"></span>' : ""}`;
  b.addEventListener("click", () => select(id));
  tabsEl.appendChild(b);
}

/* ---------- Home ---------- */
addTab("home", "Home", "home", false);
const home = document.createElement("div");
home.className = "pane home"; home.id = "pane-home";
home.innerHTML = `
  <div class="wrap">
    <h2>Plant dashboards</h2>
    <p class="lead">Choose a dashboard to open it. Each one updates every day from its own source, so you always see the latest figures.</p>
    <div class="grid" id="grid"></div>
    <p class="foot">PICL India Pvt. Ltd.</p>
  </div>`;
stage.appendChild(home);
panes.home = { pane:home };

DASHBOARDS.forEach(d => {
  addTab(d.id, d.label, d.icon, true);

  const c = document.createElement("button");
  c.className = "card"; c.style.setProperty("--c", d.color); c.style.setProperty("--cs", d.soft);
  c.innerHTML = `
    <div class="top"><div class="tile">${svg(d.icon)}</div><h3>${d.label}</h3></div>
    <p class="desc">${d.desc}</p>
    <div class="chips">${d.chips.map(x => `<span class="chip">${x}</span>`).join("")}</div>
    <span class="open">Open dashboard</span>`;
  c.addEventListener("click", () => select(d.id));
  home.querySelector("#grid").appendChild(c);

  const pane = document.createElement("div");
  pane.className = "pane"; pane.id = "pane-" + d.id;
  pane.innerHTML = `<div class="loader"><div class="ring"></div><div>Opening ${d.label}…</div>
    <div class="hint">Still loading. <a href="${d.url}" target="_blank" rel="noopener">Open it in its own tab</a></div></div>`;
  stage.appendChild(pane);
  panes[d.id] = { pane, loader:pane.querySelector(".loader"), frame:null, loaded:false, d };
});

/* ---------- load a dashboard the first time its tab opens ---------- */
const setState = (id, s) => { $("#tab-" + id).dataset.state = s };
function load(id, force){
  const p = panes[id];
  if(!p.d || (p.loaded && !force)) return;
  p.loaded = true; setState(id, "loading");
  p.loader.classList.remove("hide","slow");
  if(p.frame) p.frame.remove();
  const f = document.createElement("iframe");
  f.title = p.d.label + " dashboard"; f.allow = "fullscreen";
  f.addEventListener("load", () => { clearTimeout(p.t); p.loader.classList.add("hide"); setState(id, "live"); });
  f.src = p.d.url;
  p.pane.appendChild(f); p.frame = f;
  p.t = setTimeout(() => p.loader.classList.add("slow"), 8000);
}

/* ---------- switch tab ---------- */
function select(id){
  if(!panes[id]) id = "home";
  current = id;
  Object.keys(panes).forEach(k => {
    const on = k === id;
    panes[k].pane.classList.toggle("active", on);
    const t = $("#tab-" + k); t.setAttribute("aria-selected", on); t.tabIndex = on ? 0 : -1;
  });
  load(id);
  const d = panes[id].d;
  $("#btnOpen").style.display = d ? "" : "none";
  $("#btnReload").style.display = d ? "" : "none";
  if(d) $("#btnOpen").href = d.url;
  document.title = (d ? d.label : "Plant dashboards") + " · PICL India";
  if(location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
  $("#tab-" + id).scrollIntoView({inline:"nearest", block:"nearest"});
}

/* ---------- controls ---------- */
$("#brand").addEventListener("click", () => select("home"));
$("#btnReload").addEventListener("click", () => load(current, true));
function setTheme(t){ document.documentElement.dataset.theme = t; store.set("picl_theme", t) }
$("#btnTheme").addEventListener("click", () =>
  setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
const kiosk = on => document.body.classList.toggle("kiosk", on);
$("#btnKiosk").addEventListener("click", () => kiosk(true));
$("#btnExit").addEventListener("click", () => kiosk(false));

const order = ["home", ...DASHBOARDS.map(d => d.id)];
document.addEventListener("keydown", e => {
  if(e.target.matches("input,textarea,select") || e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.key === "Escape") kiosk(false);
  const n = parseInt(e.key, 10);
  if(n >= 0 && n < order.length) select(order[n]);
  if(e.target.closest("#tabs") && (e.key === "ArrowRight" || e.key === "ArrowLeft")){
    const i = order.indexOf(current);
    const j = (i + (e.key === "ArrowRight" ? 1 : -1) + order.length) % order.length;
    select(order[j]); $("#tab-" + order[j]).focus();
  }
});
window.addEventListener("hashchange", () => {
  const id = location.hash.slice(1);
  if(panes[id] && id !== current) select(id);
});

/* ---------- start ---------- */
setTheme(store.get("picl_theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
select(location.hash.slice(1) || "home");
</script>  
</body>
</html>
